services:
  server:
    build: ./server
    environment:
      PORT: "3000"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      DATABASE_URL: postgres://wordbaazi:${DB_PASSWORD:-wordbaazi}@postgres:5432/wordbaazi
    networks:
      - default
      - infra
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
        NEXT_PUBLIC_GTM_ID: ${GTM_ID:-}
    environment:
      INTERNAL_API_URL: http://server:3000
    ports:
      - "${WEB_PORT:-7654}:3000"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

networks:
  # Created by docker-compose-infra.yml (run it first): reaches Postgres.
  infra:
    external: true
    name: wordbaazi-infra
